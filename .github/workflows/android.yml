name: Android

# Roda a cada push e pull request: testes do protótipo, testes das regras (:core),
# testes do app e APK debug. A publicação oficial exige uma tag v* ou execução
# manual na main, com a assinatura configurada (docs/CHAVE_ASSINATURA.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publicar_assinado:
        description: Publicar o APK oficial
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototipo:
    name: Testes do protótipo (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  android:
    name: Regras, app e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes das regras (:core)
        run: ./gradlew :core:test --stacktrace

      - name: Testes e APK debug (:app)
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # O esquema do banco (app/schemas) precisa estar no Git: é a base das migrações.
      - name: Conferir esquema do banco versionado
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Esquema do Room mudou ou não está no Git. Conteúdo gerado:"
            for f in $(git ls-files --others --modified app/schemas); do echo "===== $f"; cat "$f"; echo; done
            exit 1
          fi

      - name: Guardar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: meus-fretes-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Guardar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: '**/build/reports/tests/'
          retention-days: 7

  oficial:
    name: APK oficial assinado
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publicar_assinado)
    needs: [prototipo, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: android-publicacao-oficial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK com a chave definitiva
        env:
          FRETES_KEYSTORE_BASE64: ${{ secrets.FRETES_KEYSTORE_BASE64 }}
          FRETES_KEYSTORE_PASSWORD: ${{ secrets.FRETES_KEYSTORE_PASSWORD }}
          FRETES_KEY_ALIAS: ${{ secrets.FRETES_KEY_ALIAS }}
          FRETES_KEY_PASSWORD: ${{ secrets.FRETES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          for nome in FRETES_KEYSTORE_BASE64 FRETES_KEYSTORE_PASSWORD FRETES_KEY_ALIAS FRETES_KEY_PASSWORD; do
            if [[ -z ${!nome} ]]; then
              echo "::error::Secret $nome ausente. Veja docs/CHAVE_ASSINATURA.md."
              exit 1
            fi
          done
          umask 077
          export FRETES_KEYSTORE_PATH="$RUNNER_TEMP/fretes-release.p12"
          trap 'rm -f "$FRETES_KEYSTORE_PATH"' EXIT
          printf '%s' "$FRETES_KEYSTORE_BASE64" | base64 -d > "$FRETES_KEYSTORE_PATH"
          unset FRETES_KEYSTORE_BASE64
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Validar e publicar o APK oficial
        env:
          FRETES_SIGNING_CERT_SHA256: ${{ vars.FRETES_SIGNING_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publicar-apk.sh app/build/outputs/apk/release/app-release.apk
