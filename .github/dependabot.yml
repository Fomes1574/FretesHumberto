# Avisa por pull request quando sair versão nova. Atualizar só com o build verde
# e uma coisa de cada vez (DECISOES.md, "Toolchain").
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
