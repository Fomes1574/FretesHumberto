<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Fretes — protótipo</title>
<style>
:root{
  --bg:#F3F0E8; --card:#FFFFFF; --ink:#191D1B; --muted:#565D59; --line:#DDD7CA;
  --green:#17603F; --greenSoft:#DCEFE3; --fuel:#A8500B; --fuelSoft:#FBE6D1;
  --red:#A9221B; --redSoft:#F9E0DE; --road:#2C312E; --blue:#1F4E79;
  --fs:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.35}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:1.15rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.date{color:var(--muted);font-size:.95rem}
.demo{background:#FFF6C9;border:1px solid #E8D77A;border-radius:12px;padding:10px 12px;font-size:.85rem;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{background:none;border:1px solid #9C8A2A;border-radius:10px;padding:8px 10px;font-size:.8rem;min-height:44px}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.label{font-size:.9rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.big{font-size:2.6rem;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.neg{color:var(--red)}
.pos{color:var(--green)}
.metaTxt{font-size:1.05rem;font-weight:700;margin-top:4px}
/* cena da meta */
.scene{width:100%;height:auto;display:block;margin:14px 0 6px}
.roadLbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
/* botões */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn{border:0;border-radius:16px;min-height:60px;padding:12px;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.main{grid-column:1/-1;background:var(--green);color:#fff;min-height:68px;font-size:1.15rem}
.btn.fuel{background:var(--fuelSoft);color:#6E3305}
.btn.soft{background:#E7E3D8}
.btn.line{background:#fff;border:2px solid var(--line)}
.btn:active{transform:scale(.98)}
.btn svg{width:26px;height:26px;flex:none}
/* contas */
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.total{font-size:1.15rem;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px}
.sub{font-size:.82rem;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:8px;padding:2px 8px;margin-right:6px}
.t-viagem{background:var(--greenSoft);color:var(--green)}
.t-abast{background:var(--fuelSoft);color:#7A3A06}
.t-despesa{background:#E6E8EE;color:#2D3A55}
.entry{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .info{flex:1;min-width:0}
.entry .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{background:#F0EDE5;border:0;border-radius:12px;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
h2{font-size:1.05rem;margin:0 0 6px}
/* segmentos */
.seg{display:flex;background:#E4DFD3;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:50px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.period{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.period .p{text-align:center;font-weight:700;flex:1}
.badge{display:inline-block;background:#FFF0B8;color:#5D4B00;border-radius:8px;font-size:.75rem;padding:2px 8px;margin-left:4px;vertical-align:middle}
.cmp{font-size:.92rem;color:var(--muted);margin-top:2px}
.chart svg{width:100%;height:auto;display:block}
.tip{min-height:1.6em;text-align:center;font-weight:700;margin-top:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#F6F4EE;border-radius:14px;padding:12px}
.kpi .n{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--muted)}
.fuelCard{background:var(--fuelSoft)}
.fuelCard .kpi{background:#fff8f0}
/* histórico */
.mhead{font-weight:700;color:var(--muted);margin:18px 4px 8px;display:flex;justify-content:space-between}
.day{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;border:0;width:100%;text-align:left;cursor:pointer;min-height:64px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;border:0;background:none;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer}
nav button svg{width:26px;height:26px}
nav button[aria-current=page]{color:var(--green)}
nav button[aria-current=page] .pill{background:var(--greenSoft)}
nav .pill{border-radius:14px;padding:3px 16px;display:flex}
/* folha */
.sheetBg{position:fixed;inset:0;background:rgba(20,22,21,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheetBg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:1.25rem;display:flex;justify-content:space-between;align-items:center}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;font-size:1.1rem}
.field input:focus{outline:3px solid #8CC5A6;border-color:var(--green)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.money input{padding-left:48px;font-size:1.5rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:6px 14px;font-weight:700;cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--blue);background:#E3ECF6;color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin-bottom:14px}
summary{font-weight:700;min-height:48px;display:flex;align-items:center;cursor:pointer;color:var(--blue)}
.err{color:var(--red);font-weight:700;min-height:1.2em;margin-bottom:8px}
.fuelRes{background:#fff;border-radius:14px;padding:12px 14px;margin:-4px 0 14px;display:flex;flex-direction:column;gap:2px;min-height:58px;justify-content:center}
.fuelRes b{font-size:1.4rem;color:#7A3A06}
.calcOut{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:14px;z-index:20;max-width:92%}
.toast.show{display:flex}
.toast button{background:none;border:0;color:#9FE0BC;font-weight:700;min-height:44px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.fontBtns{display:flex;gap:8px}
.fontBtns button{flex:1}
textarea.copy{width:100%;min-height:180px;border-radius:12px;border:2px solid var(--line);padding:10px;font:inherit;font-size:.9rem}

.entry .info{background:none;border:0;text-align:left;cursor:pointer;padding:0;min-height:48px}
.entry .v{font-weight:700;white-space:nowrap}
.wide{width:100%;margin-top:10px}
.danger{color:#A9221B!important;border-color:#A9221B!important}
.confirm .danger{background:#A9221B;color:#fff}
.field input,.field select,.two>*{min-width:0}
.big{overflow-wrap:anywhere}
.day{gap:12px}.day .v{font-weight:700;flex-shrink:0}
.mhead{gap:12px;flex-wrap:wrap;text-transform:capitalize}
.chartScroll{overflow-x:auto;max-width:100%;padding-bottom:8px;overscroll-behavior-x:contain}
.chartScroll svg{height:190px;display:block}
summary{gap:8px;line-height:1.35;padding:8px 0}
details.card>summary{color:#191D1B;font-size:1.05rem;margin-bottom:6px}
.kpi .n{overflow-wrap:anywhere}.kpi .l{font-size:.85rem}
.period .p{overflow-wrap:anywhere}
.sheetBg{z-index:30}.sheet{overscroll-behavior:contain;scrollbar-gutter:stable;max-height:92dvh}
.toast{z-index:40;max-width:calc(100vw - 24px);width:max-content;box-shadow:0 2px 10px #0002}
input:read-only{background:#F6F4EE}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,summary:focus-visible{outline:3px solid #17603F;outline-offset:3px}
[data-large=true] .two,[data-large=true] .kpis{grid-template-columns:1fr}
[data-large=true] .day{align-items:flex-start;flex-direction:column}
[data-large=true] .entry{flex-wrap:wrap}
[data-large=true] .entry .info{flex-basis:100%}
[data-large=true] .seg{flex-wrap:wrap;gap:4px}
[data-large=true] .seg button{flex-basis:40%}
@media(max-width:380px){.big{font-size:2.1rem}.actions{gap:8px}.wrap{padding-left:12px;padding-right:12px}.card{padding:14px}.btn{padding:10px}.kpi .n{font-size:1.15rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.btn:active{transform:none}}

</style>

const CONF_COL=['#17603F','#F1C94A','#E8743B','#2F6FB5','#FFFFFF','#C3302A'];
function confetti(k,st){
  const g=document.getElementById(k+'-conf');if(!g||reduced)return;
  const NS='http://www.w3.org/2000/svg';const ps=[];
  for(let i=0;i<90;i++){const e=document.createElementNS(NS,'rect');const w=2+Math.random()*2.2;
    e.setAttribute('width',w);e.setAttribute('height',w*.55);e.setAttribute('x',-w/2);e.setAttribute('y',-w*.27);e.setAttribute('fill',CONF_COL[i%CONF_COL.length]);g.appendChild(e);
    const a=-Math.PI/2-.45+(Math.random()-.5)*2.4;const sp=.08+Math.random()*.14;
    ps.push({e,x:SC.line+5+(Math.random()-.5)*8,y:62+Math.random()*10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*360,vr:(Math.random()-.5)*1.2,
      land:113+Math.random()*30,on:false,sy:1,fl:Math.random()*6})}

  const step=now=>{if(!document.body.contains(g))return;if(last===null){last=now;born=now}

    for(const p of ps){
      if(!p.on){p.vy+=.00032*dt;p.vx*=Math.pow(.995,dt);p.x+=p.vx*dt+Math.sin((age+p.fl*300)/180)*.04*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        if(p.y>=p.land&&p.vy>0){p.y=p.land;p.on=true;p.sy=.45}}
      const op=age>5000?Math.max(0,1-(age-5000)/1200):1;
      p.e.setAttribute('transform',`translate(${p.x.toFixed(2)},${p.y.toFixed(2)}) rotate(${p.rot.toFixed(1)}) scale(1,${p.sy})`);p.e.setAttribute('opacity',op)}
    if(age<6300)requestAnimationFrame(step);else g.innerHTML=''};
  requestAnimationFrame(step)}

function sceneStart(k,fxTo,lucTo,numEl,fmt){
  const st=AS[k]||(AS[k]={fx:SC.x0,l:0,road:0,wheel:0,raf:0});
  cancelAnimationFrame(st.raf);
  const $=id=>document.getElementById(k+'-'+id);
  if(!$('svg'))return;
  const fx0=st.fx,l0=st.l,d=fxTo-fx0;
  // só move a van se a posição mudar; acima da meta apenas o valor sobe
  const T=reduced?0:(Math.abs(d)>.3?1100+7*Math.abs(d):(lucTo!==l0?700:0));
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const draw=(fx,degPerFrame)=>{
    $('van').setAttribute('transform',`translate(${(fx-SC.vw).toFixed(2)},${SC.gy-52*SC.sc}) scale(${SC.sc})`);
    $('trail').setAttribute('width',Math.min(fx,SC.line).toFixed(2));
    const r=st.road,m=(v,n)=>((v%n)+n)%n;
    $('dash').setAttribute('transform',`translate(${(-m(r,36)).toFixed(2)},0)`);
    $('mid').setAttribute('transform',`translate(${(-m(r*.55,360)).toFixed(2)},0)`);
    $('far').setAttribute('transform',`translate(${(-m(r*.18,360)).toFixed(2)},0)`);
    // raios somem e viram borrão quando a roda gira rápido (evita o efeito estroboscópico)
    const blur=Math.max(0,Math.min(1,(degPerFrame-6)/14));
    for(let i=0;i<2;i++){const cx=i?82:20;const w=$('w'+i);w.setAttribute('transform',`rotate(${m(st.wheel,72).toFixed(1)} ${cx} 43)`);
      w.setAttribute('opacity',(1-blur).toFixed(2));$('b'+i).setAttribute('opacity',(blur*.75).toFixed(2))}};
  draw(fx0,0);   // posiciona estrada/rodas já no primeiro quadro, sem salto
  if(T===0){st.fx=fxTo;st.l=lucTo;if(numEl)numEl.textContent=fmt(lucTo);draw(fxTo,0);return}
  let t0=null,lastT=null,lastX=fx0,crossed=false;
  const step=now=>{
    if(!$('svg')){st.fx=fxTo;st.l=lucTo;return}   // saiu da tela: termina sem desenhar
    if(t0===null){t0=now;lastT=now}
    const dt=Math.max(1,Math.min(40,now-lastT));lastT=now;
    const t=Math.min(1,(now-t0)/T),e=ease(t);
    const fx=fx0+d*e;st.fx=fx;st.l=Math.round(l0+(lucTo-l0)*e);
    if(numEl)numEl.textContent=fmt(st.l);
    const v=(fx-lastX)/dt;
    if(!crossed&&lastX<SC.line+10&&fx>=SC.line+10&&v>0){crossed=true;confetti(k,st)}
    lastX=fx;
    const ground=v*3.2;                       // a estrada corre mais que a van; ao voltar, corre ao contrário
    st.road+=ground*dt;
    const ang=(ground+v)/(8.6*SC.sc)*57.3;     // graus por ms
    st.wheel+=ang*dt;
    draw(fx,Math.abs(ang)*16.7);
    if(t<1)st.raf=requestAnimationFrame(step);else draw(fx,0)};
  st.raf=requestAnimationFrame(step)}

const DOWL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const R=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const R0=R;
const brNum=(n,d=2)=>n.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const inp=n=>Number(n).toFixed(2).replace('.',',');
const dm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const longDate=s=>`${DOWL[pd(s).getDay()]}, ${pd(s).getDate()} de ${MES[pd(s).getMonth()]}`;
const shortDate=s=>`${DOW[pd(s).getDay()]}, ${pd(s).getDate()} ${MESC[pd(s).getMonth()]}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const parseMoney=Core.parseScaled,parseNum=Core.num;
const val=id=>document.getElementById(id)?.value??'';
const KEY='meusfretes_proto_v2';
let S,loadProblem='',storageProblem='';
function load(){let raw;try{raw=localStorage.getItem(KEY);S=raw?Core.normalize(JSON.parse(raw)):Core.defaults();if(!raw)S=Core.normalize({...S,lanc:seed()})}catch(err){loadProblem='Não foi possível abrir os dados salvos. Eles foram preservados. Restaure uma cópia ou tente reabrir.';S=Core.defaults();S.demo=false} }
function commit(fn){if(loadProblem){toast('Restaure uma cópia antes de alterar os dados.');return false}try{const next=Core.clone(S);fn(next);const valid=Core.normalize(next);localStorage.setItem(KEY,JSON.stringify(valid));S=valid;storageProblem='';return true}catch(err){storageProblem='Não foi possível salvar. Seus dados anteriores foram mantidos.';toast(storageProblem);return false}}
function resumo(a,b){return Core.summary(S,a,b,rep?.modo==='dois'?rep.dates:null)}
function metaTexto(luc,meta){const df=luc-meta;return df<0?`Faltam <b>${R(-df)}</b> para a meta`:df===0?'Meta atingida':`Meta atingida · <b>${R(df)}</b> acima`}
function dayGoal(d){return Core.dayGoal(S,d)}
function monthlyGoal(m){return Core.monthGoal(S,m)}
function latestPrice(){return Core.price(S)}
function processRecurring(){if(loadProblem)return;const n=Core.clone(S);if(Core.generate(n,TODAY,uid))commit(s=>Object.assign(s,n))}
function rollDate(){const d=iso(new Date());if(d!==TODAY){TODAY=d;processRecurring();render()}}
let tab='hoje',rep={modo:'semana',ref:TODAY},chartSel=null,recMonth=TODAY.slice(0,7);
function nav(){document.getElementById('nav').innerHTML=[['hoje','Hoje',I.home],['hist','Histórico',I.list],['rel','Relatórios',I.chart],['aj','Ajustes',I.gear]].map(([k,t,i])=>`<button type="button" data-tab="${k}" ${tab===k?'aria-current="page"':''}><span class="pill">${i}</span>${t}</button>`).join('')}
function demoBar(){return S.demo?'<div class="demo"><span>Valores de exemplo para testar.</span><button type="button" data-act="limpar">Começar do zero</button></div>':''}
function render(keepScroll=false){const y=window.scrollY;nav();const m=document.getElementById('main');m.innerHTML=(loadProblem?`<div class="card err" role="alert">${esc(loadProblem)}</div>`:'')+(tab==='hoje'?vHoje():tab==='hist'?vHist():tab==='rel'?vRel():tab==='contas'?vAccounts():vAj());if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);startScenes()}
function startScenes(){if(tab==='hoje'){const o=Core.summary(S,TODAY,TODAY);sceneStart('dia',fxFor(o.lucro,dayGoal(TODAY)),o.lucro,null,R)}if(tab==='rel'&&rep.modo==='mes'){const[a]=range(),o=resumo(...range()),g=monthlyGoal(a.slice(0,7));if(!g)return;if(AS.mes&&AS.mes.key!==a){AS.mes.fx=SC.x0;AS.mes.l=0}sceneStart('mes',fxFor(o.lucro,g),o.lucro,null,R);AS.mes.key=a}}
function contaDia(o){return `<div class="row"><span>Fretes <span class="sub">(${o.nF})</span></span><span class="v">${R(o.fretes)}</span></div><div class="row"><span>Combustível <span class="sub">${o.nA?'('+o.nA+' abastec.)':''}</span></span><span class="v">− ${R(o.comb)}</span></div><div class="row"><span>Outras despesas</span><span class="v">− ${R(o.outras)}</span></div><div class="row total"><b>Lucro</b><span class="v ${o.lucro<0?'neg':''}">${R(o.lucro)}</span></div>`}
function entryRow(l){const t={viagem:['Frete','t-viagem'],abast:['Combustível','t-abast'],despesa:['Despesa','t-despesa']}[l.tipo];const det=l.tipo==='viagem'?(l.km?brNum(l.km)+' km':''):l.tipo==='abast'?brNum(l.litros100/100)+' L · '+R(l.preco)+'/L':l.occKey?'mensal':'';return `<div class="entry"><button type="button" class="info" data-act="edit" data-id="${esc(l.id)}"><span class="tag ${t[1]}">${t[0]}</span><span class="sub">${esc(det)}</span><b>${esc(l.desc||(l.tipo==='abast'?'Abastecimento':l.tipo==='viagem'?'Frete':l.cat))}</b></button><span class="v">${l.tipo==='viagem'?'':'− '}${R(l.valor)}</span><button type="button" class="icon-btn" data-act="del" data-id="${esc(l.id)}" aria-label="Apagar ${esc(l.desc||t[0])} de ${R(l.valor)}">${I.trash}</button></div>`}
function checkedText(d){const c=S.checked[d];return c?(c.revision===(S.revisions[d]||0)?'Dia conferido':'Alterado após a conferência'):'Conferir dia'}
function vHoje(){const o=Core.summary(S,TODAY,TODAY),meta=dayGoal(TODAY),lst=S.lanc.filter(l=>l.data===TODAY).slice().reverse(),[ma]=monthRange(TODAY),om=Core.summary(S,ma,TODAY);return `${demoBar()}<div class="top"><div><h1>Meus Fretes</h1><div class="date">${longDate(TODAY)}</div></div></div><div class="card"><div class="label">LUCRO DE HOJE</div><div class="big ${o.lucro<0?'neg':''}" id="lucroHoje">${R(o.lucro)}</div><div class="metaTxt">${metaTexto(o.lucro,meta)}</div>${sceneSVG('dia',(AS.dia||{fx:SC.x0}).fx,'Meta '+R(meta))}</div><div class="actions"><button type="button" class="btn main" data-act="novo" data-tipo="viagem">${I.plus} Anotar frete</button><button type="button" class="btn fuel" data-act="novo" data-tipo="abast">${I.fuel} Abasteci</button><button type="button" class="btn soft" data-act="novo" data-tipo="despesa">${I.bill} Outra despesa</button><button type="button" class="btn line" data-act="calc" style="grid-column:1/-1">${I.calc} Calcular frete</button></div><div class="card"><h2>Conta de hoje</h2>${contaDia(o)}<div class="sub">Combustível pelos abastecimentos.</div></div><div class="card"><h2>Lançado hoje</h2>${lst.length?lst.map(entryRow).join(''):'<div class="empty">Nada anotado ainda hoje.</div>'}${lst.length?`<button class="btn line wide" data-act="checkDay" data-d="${TODAY}">${checkedText(TODAY)}</button>`:''}</div><details class="card"><summary>Este mês até agora</summary><div class="kpis"><div class="kpi"><div class="n ${om.lucro<0?'neg':''}">${R(om.lucro)}</div><div class="l">lucro no mês</div></div><div class="kpi"><div class="n">${R(om.comb)}</div><div class="l">em combustível</div></div></div><button type="button" class="btn line wide" data-act="vermes">Ver relatório do mês</button></details>`}
function vHist(){const days=[...new Set(S.lanc.map(l=>l.data))].sort().reverse();let h=`${demoBar()}<h1>Histórico</h1><p class="date">Toque num dia para ver ou corrigir.</p><div class="two"><button class="btn line" data-act="twoDays">Comparar dois dias</button><button class="btn line" data-act="accounts">Contas do mês</button></div>`;if(!days.length)return h+'<div class="card empty">Ainda não há lançamentos.</div>';let m='';for(const d of days){if(d.slice(0,7)!==m){m=d.slice(0,7);const o=Core.summary(S,...monthRange(d));h+=`<div class="mhead"><span>${MES[pd(d).getMonth()]} ${pd(d).getFullYear()}</span><span>${R(o.lucro)}</span></div>`}const o=Core.summary(S,d,d);h+=`<button type="button" class="day" data-act="dia" data-d="${d}"><span><b>${shortDate(d)}${d===TODAY?' · hoje':''}</b><br><span class="sub">${o.nF} frete${o.nF===1?'':'s'}${o.nA?' · abasteceu':''}</span>${o.nF?`<br><span class="sub">${metaTexto(o.lucro,dayGoal(d))}</span>`:''}</span><span class="v ${o.lucro<0?'neg':''}">${R(o.lucro)}</span></button>`}return h}
function range(){if(rep.modo==='dia')return[rep.ref,rep.ref];if(rep.modo==='semana'){const a=weekStart(rep.ref);return[a,addD(a,6)]}if(rep.modo==='mes')return monthRange(rep.ref);if(rep.modo==='dois')return[...rep.dates].sort();return[rep.de,rep.ate]}
function shift(n){if(rep.modo==='dia')rep.ref=addD(rep.ref,n);else if(rep.modo==='semana')rep.ref=addD(rep.ref,7*n);else if(rep.modo==='mes')rep.ref=addM(rep.ref.slice(0,7)+'-01',n);chartSel=null}
function rotulo(a,b){if(rep.modo==='dia')return longDate(a);if(rep.modo==='semana')return`Semana de ${dm(a)} a ${dm(b)}`;if(rep.modo==='mes')return`${MES[pd(a).getMonth()]} de ${pd(a).getFullYear()}`;return`${dm(a)}/${a.slice(0,4)} ${rep.modo==='dois'?'e':'a'} ${dm(b)}/${b.slice(0,4)}`}
function barChart(a,b,o){const days=rep.modo==='dois'?[...rep.dates].sort():[];if(!days.length)for(let d=a;d<=b;d=addD(d,1))days.push(d);const W=Math.max(340,days.length*42),H=190,top=24,bot=30,n=days.length,gw=W/n,bw=Math.min(34,gw*.68),goals=days.map(dayGoal),vals=days.map(d=>o.dias[d]||0),mx=Math.max(...goals.map(x=>x*1.15),...vals,1),mn=Math.min(0,...vals),sc=(H-top-bot)/(mx-mn),y0=top+mx*sc;let s=`<div class="chartScroll" tabindex="0" aria-label="Gráfico de lucro por dia; deslize para ver os outros dias"><svg style="width:${W}px;max-width:none" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lucro por dia; os mesmos valores estão na lista de dias">`;if(goals.every(x=>x===goals[0])){const ym=y0-goals[0]*sc;s+=`<line x1="0" x2="${W}" y1="${ym}" y2="${ym}" stroke="#17603F" stroke-dasharray="5 5" stroke-width="1.5"/>`}s+=`<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#B8B1A2"/>`;days.forEach((d,i)=>{const v=vals[i],x=i*gw+(gw-bw)/2,h=Math.abs(v)*sc,y=v>=0?y0-h:y0,fill=v<0?'#A9221B':v>=goals[i]?'#17603F':'#7FB394';s+=`<rect data-act="bar" data-d="${d}" x="${i*gw}" y="${top}" width="${gw}" height="${H-top}" fill="transparent"/>`;if(d<=TODAY&&o.porDia[d])s+=`<rect pointer-events="none" x="${x}" y="${y}" width="${bw}" height="${Math.max(h,2)}" rx="3" fill="${fill}" ${chartSel===d?'stroke="#191D1B" stroke-width="2.5"':''}/>`;if(n<=7&&o.porDia[d])s+=`<text pointer-events="none" x="${x+bw/2}" y="${(v>=0?y:y+h)-5}" text-anchor="middle" font-size="12" fill="#191D1B">${Math.round(v/100)}</text>`;s+=`<text pointer-events="none" x="${i*gw+gw/2}" y="${H-8}" text-anchor="middle" font-size="13" fill="#565D59">${n<=7?DOW[pd(d).getDay()]:dm(d)}</text>`});return s+'</svg></div>'}
function listDays(o){return Object.keys(o.porDia).sort().map(d=>`<button class="day" data-act="dia" data-d="${d}"><span>${shortDate(d)}<br><span class="sub">${d.slice(0,4)}</span></span><b class="${o.dias[d]<0?'neg':''}">${R(o.dias[d])}</b></button>`).join('')||'<p class="sub">Sem lançamentos neste período.</p>'}
function vRel(){const[a,b]=range(),o=resumo(a,b),m=rep.modo,partial=a<=TODAY&&b>=TODAY&&m!=='dia'&&m!=='dois';let cmp='';if(m!=='dois'){const[pa,pb]=Core.previousRange(m,a,b,TODAY),prev=Core.summary(S,pa,pb);if(Object.keys(prev.porDia).length){const delta=o.lucro-prev.lucro;cmp=`${R(Math.abs(delta))} ${delta>=0?'a mais':'a menos'} que ${dm(pa)} a ${dm(pb)}${partial?' (mesmos dias)':''}`}}let h=`${demoBar()}<h1 style="margin-bottom:12px">Relatórios</h1><div class="seg" role="group" aria-label="Período">${[['dia','Dia'],['semana','Semana'],['mes','Mês'],['periodo','Período']].map(([k,t])=>`<button type="button" data-act="modo" data-m="${k}" aria-pressed="${m===k}">${t}</button>`).join('')}</div>`;if(['periodo','dois'].includes(m))h+=`<div class="period"><div class="p">${rotulo(a,b)}</div><button class="btn line" data-act="${m==='dois'?'twoDays':'customRange'}">Alterar</button></div>`;else h+=`<div class="period"><button class="icon-btn" data-act="prev" aria-label="Período anterior">${I.left}</button><div class="p">${rotulo(a,b)}${partial?'<span class="badge">Parcial</span>':''}</div><button class="icon-btn" data-act="next" aria-label="Próximo período" ${b>=TODAY?'disabled':''}>${I.right}</button></div>`;h+=`<div class="card"><div class="label">LUCRO ${m==='dia'?'DO DIA':m==='semana'?'DA SEMANA':m==='mes'?'DO MÊS':'DO PERÍODO'}</div><div class="big ${o.lucro<0?'neg':''}">${R(o.lucro)}</div>${cmp?`<div class="cmp">${cmp}</div>`:''}${m==='dia'&&o.nF?`<div class="metaTxt">${metaTexto(o.lucro,dayGoal(a))}</div>`:''}${m==='mes'?metaMes(o,a):''}</div>`;
 if(m==='dois'){const dates=[...rep.dates].sort(),x=Core.summary(S,dates[0],dates[0]),y=Core.summary(S,dates[1],dates[1]);h+=`<div class="card"><h2>Dois dias escolhidos</h2><div class="row"><span>${dm(dates[0])}</span><b>${R(x.lucro)}</b></div><div class="row"><span>${dm(dates[1])}</span><b>${R(y.lucro)}</b></div><div class="sub">Diferença entre os dias: ${R(Math.abs(y.lucro-x.lucro))}. A soma inclui somente esses dois dias.</div></div>`}
 if(m!=='dia')h+=`<div class="card chart"><h2>Lucro por dia</h2>${barChart(a,b,o)}<div class="tip">${chartSel&&o.porDia[chartSel]?`${shortDate(chartSel)}: ${R(o.dias[chartSel])}`:'Deslize o gráfico ou abra a lista de dias.'}</div>${chartSel&&o.porDia[chartSel]?`<button class="btn line wide" data-act="dia" data-d="${chartSel}">Abrir este dia</button>`:''}<details><summary>Ver valores por dia</summary>${listDays(o)}</details></div><details class="card"><summary>Metas e média</summary><div class="kpis"><div class="kpi"><div class="n">${o.metaOk} de ${o.trab.size}</div><div class="l">dias trabalhados com a meta do dia atingida</div></div><div class="kpi"><div class="n">${o.trab.size?R(Math.round(o.lucro/o.trab.size)):'—'}</div><div class="l">resultado do período por dia trabalhado</div></div></div></details>`;
 h+=`<div class="card"><h2>Conta do período</h2>${contaDia(o)}${Object.keys(o.cats).length?`<div class="sub">${Object.entries(o.cats).map(([k,v])=>esc(k)+': '+R(v)).join(' · ')}</div>`:''}</div><details class="card fuelCard"><summary>Combustível no período</summary><div class="kpis"><div class="kpi"><div class="n">${R(o.comb)}</div><div class="l">${o.nA} abastecimento${o.nA===1?'':'s'}</div></div><div class="kpi"><div class="n">${o.litros100?brNum(o.litros100/100)+' L':'—'}</div><div class="l">${o.litros100?'preço médio '+R(Core.roundDiv(BigInt(o.comb)*100n,o.litros100))+'/L':'sem litros informados'}</div></div><div class="kpi"><div class="n">${o.fretes?Math.round(o.comb/o.fretes*100)+'%':'—'}</div><div class="l">do valor dos fretes para o tanque</div></div><div class="kpi"><div class="n">${o.km?brNum(o.km)+' km':'—'}</div><div class="l">anotados nos fretes</div></div></div></details>`;
 if(m==='dia'){const lst=S.lanc.filter(l=>l.data===a);h+=`<div class="card"><h2>Lançamentos</h2>${lst.length?lst.map(entryRow).join(''):'<div class="empty">Nada neste dia.</div>'}<div class="actions"><button class="btn main" data-act="novo" data-tipo="viagem" data-d="${a}">Anotar frete neste dia</button><button class="btn fuel" data-act="novo" data-tipo="abast" data-d="${a}">Abasteci</button><button class="btn soft" data-act="novo" data-tipo="despesa" data-d="${a}">Outra despesa</button></div>${lst.length?`<button class="btn line wide" data-act="checkDay" data-d="${a}">${checkedText(a)}</button>`:''}</div>`}if(m==='mes')h+=fuelMonths(a);h+='<button class="btn line wide" data-act="share">Compartilhar resumo</button>';return h}
function fuelMonths(ref){const end=ref.slice(0,7)+'-01',months=Array.from({length:6},(_,i)=>addM(end,i-5)),totals=months.map(m=>Core.summary(S,...monthRange(m)).comb),max=Math.max(...totals,1);return `<details class="card"><summary>Combustível nos últimos 6 meses</summary><svg viewBox="0 0 340 170" role="img" aria-label="Gasto mensal com combustível; valores na lista abaixo" style="width:100%;height:auto">${months.map((m,i)=>{const h=totals[i]/max*112;return `<rect x="${i*56+12}" y="${130-h}" width="30" height="${h}" rx="3" fill="#A96A2D"/><text x="${i*56+27}" y="150" text-anchor="middle" font-size="12" fill="#565D59">${MESC[pd(m).getMonth()]}</text>`}).join('')}</svg>${months.map((m,i)=>`<div class="row"><span>${MESC[pd(m).getMonth()]} ${m.slice(0,4)}${m<=TODAY&&m.slice(0,7)===TODAY.slice(0,7)?' · parcial':''}</span><b>${R(totals[i])}</b></div>`).join('')}</details>`}
function metaMes(o,a){const meta=monthlyGoal(a.slice(0,7));return meta?`<div class="metaTxt">${metaTexto(o.lucro,meta)}</div>${sceneSVG('mes',AS.mes?.key===a?AS.mes.fx:SC.x0,'Meta do mês '+R(meta))}`:''}
function shareText(){const[a,b]=range(),o=resumo(a,b);return`Meus Fretes — ${rotulo(a,b)}\nFretes: ${R(o.fretes)} (${o.nF})\nCombustível: ${R(o.comb)}\nOutras despesas: ${R(o.outras)}\nLucro: ${R(o.lucro)}${rep.modo==='dia'?'\nMeta do dia: '+R(dayGoal(a)):rep.modo==='mes'?'\nMeta do mês: '+R(monthlyGoal(a.slice(0,7))):''}`}
function vAj(){const s=S.settings,g=dayGoal(TODAY),month=TODAY.slice(0,7);return `<h1 style="margin-bottom:12px">Ajustes</h1><form class="card" id="ajForm"><div class="field"><label for="aMeta">Meta de lucro por dia</label><div class="money"><span>R$</span><input id="aMeta" inputmode="decimal" value="${inp(g/100)}"></div><span class="sub">A nova meta diária vale a partir de hoje.</span></div><div class="field"><label for="aMesRef">Mês da meta mensal</label><input id="aMesRef" type="month" value="${month}"></div><div class="field"><label for="aMes">Meta de lucro do mês escolhido</label><div class="money"><span>R$</span><input id="aMes" inputmode="decimal" value="${inp(monthlyGoal(month)/100)}"></div></div><div class="two"><div class="field"><label for="aKml">Consumo (km por litro)</label><input id="aKml" inputmode="decimal" value="${inp(s.kml)}"></div><div class="field"><label for="aPreco">Preço do litro</label><input id="aPreco" inputmode="decimal" value="${inp(latestPrice()/100)}"></div></div><p class="sub">Alterar a meta mensal afeta só o mês escolhido. Os lançamentos antigos são preservados.</p><div class="err" id="ajErr" role="alert"></div><button class="btn main wide" type="submit">Salvar ajustes</button></form><div class="card"><h2>Tamanho da letra</h2><div class="fontBtns">${[[18,'A'],[20,'A+'],[23,'A++']].map(([v,t])=>`<button class="btn ${s.fs===v?'main':'line'}" style="grid-column:auto" data-act="fs" data-v="${v}" aria-pressed="${s.fs===v}">${t}</button>`).join('')}</div></div><div class="card"><h2>Contas do mês</h2><button class="btn line wide" data-act="accounts">Ver despesas mensais</button></div><div class="card"><h2>Cópia de segurança</h2><p class="sub">${s.lastBackup?'Última cópia: '+new Date(s.lastBackup).toLocaleString('pt-BR'):'Nenhuma cópia feita.'}${!s.lastBackup||Date.now()-Date.parse(s.lastBackup)>=7*86400000?' É hora de fazer uma cópia.':''}</p><button class="btn line wide" data-act="backup">Fazer cópia</button><button class="btn line wide" data-act="restore">Restaurar cópia</button><input id="restoreFile" type="file" accept=".fretes,application/json" hidden></div><details class="card"><summary>Dados de teste</summary><p class="sub">Use os exemplos somente para experimentar o protótipo.</p><button class="btn line wide" data-act="reset">Recarregar exemplos</button><button class="btn line wide danger" data-act="limpar">Apagar tudo</button></details>`}

function calcSheet(){openSheet(formHead('Calcular frete')+`<p class="sub">Esta conta não altera os lançamentos do dia.</p><div class="field"><label for="cVal">Quanto fica para você</label><div class="money"><span>R$</span><input id="cVal" inputmode="decimal" placeholder="0,00"></div></div><div class="two"><div class="field"><label for="cKm">Km totais</label><input id="cKm" inputmode="decimal"><span class="sub">Inclua coleta e retorno, se houver.</span></div><div class="field"><label for="cMin">Duração (minutos)</label><input id="cMin" inputmode="numeric" placeholder="Opcional"></div></div><div class="field"><label for="cOut">Pedágio e outros custos</label><div class="money"><span>R$</span><input id="cOut" inputmode="decimal" placeholder="0,00"></div></div><div class="two"><div class="field"><label for="cKml">Km por litro</label><input id="cKml" inputmode="decimal" value="${inp(S.settings.kml)}"></div><div class="field"><label for="cPr">Preço do litro</label><input id="cPr" inputmode="decimal" value="${inp(latestPrice()/100)}"></div></div><div class="calcOut" id="cOutBox" aria-live="polite"><div class="empty">Preencha os valores para ver a conta.</div></div><button class="btn line wide" data-act="calcClear">Limpar cálculo</button><button class="btn main wide" data-act="close">Fechar</button>`,'calc')}

function reconcileRec(s,r,from){for(const[key,o]of Object.entries(s.occ)){if(o.recId!==r.id||o.mes<from||o.status==='pulada'||o.override)continue;const l=s.lanc.find(l=>l.id===o.lancId);if(!l)continue;const v=Core.recVersion(r,o.mes),d=Core.dueDate(o.mes,v.dia);if(!v.ativa)continue;if(d>TODAY||(v.fim&&d>v.fim)){s.lanc=s.lanc.filter(x=>x.id!==l.id);Core.touch(s,l.data);s.occ[key]={recId:r.id,mes:o.mes,status:'prevista'};continue}Core.saveEntry(s,{...l,data:d,valor:v.valor,desc:v.nome,cat:v.cat});delete s.occ[key].override}}
function submitRec(){const nome=val('rNome').trim(),valor=parseMoney(val('rValor')),dia=Core.integer(val('rDia')),inicio=val('rInicio'),fim=val('rFim'),err=document.getElementById('recErr');if(!nome||!(valor>0)||!(dia>=1&&dia<=31)||!Core.validDate(inicio)||(fim&&(!Core.validDate(fim)||fim<inicio))){err.textContent='Confira nome, valor, dia e datas.';return}const id=recEditId||uid(),scope=val('rScope'),m=recMonth;const ok=commit(s=>{let r=s.rec.find(x=>x.id===id);const v={desde:m,nome,valor,dia,cat:'Conta mensal',fim,ativa:true};if(!r){r={id,inicio,versions:[{...v,desde:inicio.slice(0,7)}]};s.rec.push(r)}else if(scope==='month'){const key=id+'|'+m,o=s.occ[key],l=o?.lancId?s.lanc.find(x=>x.id===o.lancId):null,override={data:Core.dueDate(m,dia),valor,desc:nome,cat:'Conta mensal'};if(l){if(override.data<=TODAY){Core.saveEntry(s,{...l,...override})}else{s.lanc=s.lanc.filter(x=>x.id!==l.id);Core.touch(s,l.data);s.occ[key]={recId:id,mes:m,status:'prevista',override}}}else s.occ[key]={recId:id,mes:m,status:'prevista',override}}else{r.versions=r.versions.filter(v=>v.desde<m);r.versions.push(v);reconcileRec(s,r,m)}Core.generate(s,TODAY,uid)});if(ok){closeSheet(false);tab='contas';render();toast('Conta mensal salva.')}else err.textContent=storageProblem}
function recSkip(id){const key=id+'|'+recMonth;const ok=commit(s=>{const o=s.occ[key];if(o?.status==='pulada'){const r=s.rec.find(r=>r.id===id),v=Core.recVersion(r,recMonth);s.occ[key]={recId:id,mes:recMonth,status:'prevista',override:o.override||{data:Core.dueDate(recMonth,v.dia),valor:v.valor,desc:v.nome,cat:v.cat}};Core.generate(s,TODAY,uid)}else{if(o?.lancId){const l=s.lanc.find(x=>x.id===o.lancId);if(l){s.lanc=s.lanc.filter(x=>x.id!==l.id);Core.touch(s,l.data)}}s.occ[key]={recId:id,mes:recMonth,status:'pulada'}}});if(ok){render(true);toast('Conta atualizada.')}}

const bytes64=a=>{let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)};
const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function passwordKey(password,salt,usage){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,usage)}
async function encodeBackup(state,password){const payload=JSON.stringify(Core.normalize(state));if(!password)return JSON.stringify({format:'FretesHumberto',formatVersion:1,encrypted:false,payload:JSON.parse(payload)});const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=crypto.subtle?await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('FretesHumberto:1')},await passwordKey(password,salt,['encrypt']),new TextEncoder().encode(payload)):await FretesCrypto.encrypt(password,salt,iv,new TextEncoder().encode(payload));return JSON.stringify({format:'FretesHumberto',formatVersion:1,encrypted:true,algorithm:'AES-GCM',kdf:'PBKDF2-SHA256',iterations:210000,salt:bytes64(salt),iv:bytes64(iv),ciphertext:bytes64(new Uint8Array(ct))})}
async function decodeBackup(text,password){if(text.length>10000000)throw Error('Arquivo muito grande.');let env;try{env=JSON.parse(text)}catch{throw Error('O arquivo não é uma cópia válida.')}if(env.format!=='FretesHumberto'||env.formatVersion!==1)throw Error('Formato de cópia incompatível.');if(env.encrypted===false)return Core.normalize(env.payload);if(env.encrypted!==true||env.algorithm!=='AES-GCM'||env.kdf!=='PBKDF2-SHA256'||env.iterations!==210000)throw Error('Proteção incompatível.');try{const salt=from64(env.salt),iv=from64(env.iv);if(salt.length!==16||iv.length!==12)throw Error();const data=crypto.subtle?await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('FretesHumberto:1')},await passwordKey(password,salt,['decrypt']),from64(env.ciphertext)):await FretesCrypto.decrypt(password,salt,iv,from64(env.ciphertext));return Core.normalize(JSON.parse(new TextDecoder().decode(data)))}catch{throw Error('Senha incorreta ou cópia danificada.')}}

function backupSheet(){openSheet(formHead('Fazer cópia')+`<form id="backupForm"><p class="sub">Guarde uma cópia fora deste aparelho para poder restaurar depois.</p><div class="field"><label for="backupPassword">Senha (opcional)</label><input id="backupPassword" type="password" autocomplete="new-password"></div><div class="err" id="backupErr" role="alert"></div><button class="btn main wide" type="submit">Baixar cópia</button></form>`,'backup')}
let restoreText='',restoreCandidate=null;
function restoreSheet(text){restoreText=text;restoreCandidate=null;openSheet(formHead('Restaurar cópia')+`<form id="restoreForm"><p class="sub">A cópia será validada antes de substituir os dados. Uma cópia dos dados atuais será baixada antes da restauração.</p><div class="field"><label for="restorePassword">Senha da cópia, se houver</label><input id="restorePassword" type="password" autocomplete="current-password"></div><div class="err" id="restoreErr" role="alert"></div><button class="btn main wide" type="submit">Validar cópia</button></form>`,'restore')}
function finishRestore(candidate){try{const next=Core.clone(candidate);Core.generate(next,TODAY,uid);localStorage.setItem(KEY,JSON.stringify(Core.normalize(next)));S=next;loadProblem='';drafts={};closeSheet(false);tab='hoje';render();toast('Cópia restaurada.')}catch{toast('Não foi possível restaurar. Os dados anteriores foram mantidos.')}}
function showCopy(text){openSheet(formHead('Resumo')+`<p class="sub">Copie este texto para compartilhar.</p><textarea class="copy" readonly>${esc(text)}</textarea>`,'copy')}
async function share(){const text=shareText();if(navigator.share){try{await navigator.share({title:'Meus Fretes',text});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);toast('Resumo copiado.')}catch{showCopy(text)}}
function resetData(withExamples){const next=Core.defaults();next.settings.fs=S.settings.fs;next.demo=withExamples;next.lanc=withExamples?seed():[];if(commit(s=>{for(const k of Object.keys(s))delete s[k];Object.assign(s,next)})){drafts={};closeSheet(false);tab='hoje';render();toast(withExamples?'Exemplos carregados.':'Pronto para começar.')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();return}const a=t.dataset.act;if(a==='novo')sheetForm(t.dataset.tipo,null,t.dataset.d);else if(a==='edit'){const l=S.lanc.find(x=>x.id===t.dataset.id);if(l)sheetForm(l.tipo,l)}else if(a==='del'){let removed;if(commit(s=>{removed=Core.removeEntry(s,t.dataset.id)})){render(true);toast('Lançamento apagado.','Desfazer',()=>{if(commit(s=>Core.restoreEntry(s,removed)))render(true)})}}else if(a==='close')closeSheet();else if(a==='saveMore')submitEntry(true);else if(a==='cat'){cat=t.dataset.c;document.querySelectorAll('#fCats button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===cat))}else if(a==='abMode'){if(t.dataset.m===abMode)return;const c=abCalc();if(abMode==='preco'){abInit.preco=val('fAux');if(c)abInit.litros=inp(c.litros100/100)}else{abInit.litros=val('fAux');if(c)abInit.preco=inp(c.preco/100)}abMode=t.dataset.m;document.querySelectorAll('[data-act=abMode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===abMode));abAux()}else if(a==='calc'||a==='calcClear')calcSheet();else if(a==='vermes'){tab='rel';rep={modo:'mes',ref:TODAY};render()}else if(a==='dia'){tab='rel';rep={modo:'dia',ref:t.dataset.d};render()}else if(a==='modo'){if(t.dataset.m==='periodo'){customRange();return}rep={modo:t.dataset.m,ref:rep.ref||TODAY};chartSel=null;render()}else if(a==='customRange')customRange();else if(a==='twoDays')twoDays();else if(a==='prev'){shift(-1);render()}else if(a==='next'){if(range()[1]<TODAY){shift(1);render()}}else if(a==='bar'){chartSel=t.dataset.d;render(true)}else if(a==='share')share();else if(a==='fs'){if(commit(s=>s.settings.fs=Number(t.dataset.v))){applyFs();render(true)}}else if(a==='accounts'){recMonth=TODAY.slice(0,7);tab='contas';render()}else if(a==='recPrev'||a==='recNext'){recMonth=addM(recMonth+'-01',a==='recPrev'?-1:1).slice(0,7);render()}else if(a==='recNew')recForm();else if(a==='recEdit'){const r=S.rec.find(r=>r.id===t.dataset.id);if(r)recForm(r)}else if(a==='recSkip')recSkip(t.dataset.id);else if(a==='recToggle')recToggle(t.dataset.id);else if(a==='checkDay'){if(commit(s=>s.checked[t.dataset.d]={revision:s.revisions[t.dataset.d]||0,stamp:new Date().toISOString()})){render(true);toast('Dia conferido.')}}else if(a==='backup')backupSheet();else if(a==='restore')document.getElementById('restoreFile').click();else if(a==='limpar')confirmar('Apagar todos os lançamentos?','Apagar tudo',()=>resetData(false));else if(a==='reset')confirmar('Substituir os dados pelos exemplos?','Substituir',()=>resetData(true))});
document.addEventListener('input',e=>{const el=e.target;if(el.inputMode==='numeric')el.value=el.value.replace(/\D/g,'');if(sheetKind==='entry'){captureDraft();if(edit?.tipo==='abast'&&['fVal','fAux'].includes(el.id))abUpd()}if(sheetKind==='calc')calcUpd()});
document.addEventListener('change',async e=>{if(e.target.id==='aMesRef'){const m=val('aMesRef');if(Core.validMonth(m))document.getElementById('aMes').value=inp(monthlyGoal(m)/100)}if(e.target.id==='restoreFile'){const f=e.target.files?.[0];if(!f)return;if(f.size>10000000){toast('A cópia é muito grande.');return}try{restoreSheet(await f.text())}catch{toast('Não foi possível ler o arquivo.')}finally{e.target.value=''}}});
document.addEventListener('focusout',e=>{if(e.target.matches('input[inputmode=decimal]')){const n=parseMoney(e.target.value);if(Number.isFinite(n))e.target.value=inp(n/100)}});
document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id;if(id==='fForm')submitEntry(false);else if(id==='recForm')submitRec();else if(id==='rangeForm'){const a=val('rangeFrom'),b=val('rangeTo'),err=Core.validRange(a,b,TODAY);if(err){document.getElementById('rangeErr').textContent=err;return}rep={modo:'periodo',de:a,ate:b,ref:b};chartSel=null;closeSheet(false);tab='rel';render()}else if(id==='twoForm'){const a=val('twoA'),b=val('twoB');if(!Core.validDate(a)||!Core.validDate(b)||a>TODAY||b>TODAY||a===b){document.getElementById('twoErr').textContent='Escolha dois dias diferentes, até hoje.';return}rep={modo:'dois',dates:[a,b].sort(),ref:b};chartSel=null;closeSheet(false);tab='rel';render()}else if(id==='ajForm'){const g=parseMoney(val('aMeta')),m=parseMoney(val('aMes')),ref=val('aMesRef'),k=parseNum(val('aKml')),p=parseMoney(val('aPreco'));if(!(g>0)||!Core.money(m)||!Core.validMonth(ref)||!(k>0&&k<=1000)||!(p>0)){document.getElementById('ajErr').textContent='Confira metas, mês, consumo e preço.';return}if(commit(s=>{if(g!==Core.dayGoal(s,TODAY))Core.setDayGoal(s,TODAY,g);s.goalsMonth[ref]=m;s.settings.kml=k;if(p!==Core.price(s)){s.settings.preco=p;s.settings.manualPrice={data:TODAY,preco:p,stamp:new Date().toISOString()}}})){toast('Ajustes salvos.');render(true)}}else if(id==='backupForm'){const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const next=Core.clone(S);next.settings.lastBackup=new Date().toISOString();const encoded=await encodeBackup(next,val('backupPassword'));backupReady(encoded,next.settings.lastBackup);}catch(err){document.getElementById('backupErr').textContent=err.message}finally{btn.disabled=false}}else if(id==='restoreForm'){const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{restoreCandidate=await decodeBackup(restoreText,val('restorePassword'));const n=restoreCandidate.lanc.length,currentURL=downloadURL(await encodeBackup(S,''));openSheet(formHead('Cópia validada')+`<p>${n} lançamentos encontrados.</p><p class="sub">Para proteger os dados atuais, baixe uma cópia sem senha antes de substituir.</p><a class="btn line wide" id="beforeRestore" href="${currentURL}" download="MeusFretes-antes-restaurar-${TODAY}.fretes">Baixar cópia atual e continuar</a><button class="btn main wide" id="applyRestore" disabled>Restaurar esta cópia</button><button class="btn line wide" data-act="close">Cancelar</button>`,'confirmRestore');document.getElementById('beforeRestore').onclick=()=>{document.getElementById('applyRestore').disabled=false};document.getElementById('applyRestore').onclick=()=>finishRestore(restoreCandidate)}catch(err){document.getElementById('restoreErr').textContent=err.message}finally{btn.disabled=false}}});
document.getElementById('sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
document.addEventListener('keydown',e=>{if(!document.getElementById('sheetBg').classList.contains('open'))return;if(e.key==='Escape'){closeSheet();return}if(e.key==='Tab'){const els=[...document.querySelectorAll('#sheet a[href],#sheet button:not([disabled]),#sheet input:not([hidden]),#sheet select,#sheet textarea')].filter(el=>el.offsetParent!==null);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function applyFs(){document.documentElement.style.setProperty('--fs',(S.settings.fs||18)+'px');document.documentElement.dataset.large=String(S.settings.fs===23)}
window.addEventListener('focus',()=>{rollDate();processRecurring()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollDate();processRecurring()}});setInterval(rollDate,30000);
load();processRecurring();applyFs();render();

</script>
</body>
