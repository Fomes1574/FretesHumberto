name: Android

# Roda a cada push e pull request: testes do protótipo, testes das regras (:core),
# testes do app e APK debug. Em tag v* (ex.: v0.1.0) também gera o APK release assinado,
# desde que os Secrets da chave estejam configurados (docs/CHAVE_ASSINATURA.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototipo:
    name: Testes do protótipo (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  android:
    name: Regras, app e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes das regras (:core)
        run: ./gradlew :core:test --stacktrace

      - name: Testes e APK debug (:app)
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # O esquema do banco (app/schemas) precisa estar no Git: é a base das migrações.
      - name: Conferir esquema do banco versionado
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Esquema do Room mudou ou não está no Git. Conteúdo gerado:"
            for f in $(git ls-files --others --modified app/schemas); do echo "===== $f"; cat "$f"; echo; done
            exit 1
          fi

      - name: Guardar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: meus-fretes-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # APK de teste com link direto (sem .zip), na página Releases, etiqueta fixa "teste".
      # Cada execução manual ou push no main troca o arquivo; o link continua o mesmo:
      # https://github.com/Fomes1574/FretesHumberto/releases/download/teste/MeusFretes-teste.apk
      - name: Publicar APK de teste nos Releases
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeusFretes-teste.apk
          cat > notas.md <<NOTAS
          **Versão de teste** do Meus Fretes, gerada automaticamente do commit \`${GITHUB_SHA::7}\` (branch \`${GITHUB_REF_NAME}\`).

          Baixe o arquivo **MeusFretes-teste.apk** abaixo direto no celular (Android 8 ou mais novo) e toque nele para instalar. Se o Android pedir, permita "instalar apps desconhecidos". Se o Play Protect avisar, toque em "Instalar mesmo assim".

          - Aparece no celular como **Meus Fretes (teste)** e fica separado da versão definitiva.
          - Não é a versão assinada para uso real: ela não vai ser atualizada por cima da versão definitiva. Para levar dados de uma para outra, use Ajustes → Fazer cópia / Restaurar cópia.
          - Não tem nenhum dado real.
          NOTAS
          gh release delete teste --yes --cleanup-tag || true
          gh release create teste MeusFretes-teste.apk --prerelease --target "$GITHUB_SHA" \
            --title "Meus Fretes — versão de teste" --notes-file notas.md

      - name: Guardar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: '**/build/reports/tests/'
          retention-days: 7

      # ---- Release assinado: só em tag v* e só se a chave existir nos Secrets.
      - name: Preparar chave de assinatura
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.FRETES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret FRETES_KEYSTORE_BASE64 ausente. Veja docs/CHAVE_ASSINATURA.md"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fretes.jks"
          echo "FRETES_KEYSTORE_PATH=$RUNNER_TEMP/fretes.jks" >> "$GITHUB_ENV"

      - name: APK release assinado
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FRETES_KEYSTORE_PASSWORD: ${{ secrets.FRETES_KEYSTORE_PASSWORD }}
          FRETES_KEY_ALIAS: ${{ secrets.FRETES_KEY_ALIAS }}
          FRETES_KEY_PASSWORD: ${{ secrets.FRETES_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MeusFretes-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "MeusFretes-${GITHUB_REF_NAME}.apk" \
            --title "Meus Fretes ${GITHUB_REF_NAME}" \
            --notes "APK assinado para instalar por cima da versão anterior. Veja CHANGELOG.md."
