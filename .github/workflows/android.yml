name: Android

# Roda a cada push e pull request: testes do protótipo, testes das regras (:core),
# testes do app e APK debug. Em tag v* (ex.: v0.1.0) também gera o APK release assinado,
# desde que os Secrets da chave estejam configurados (docs/CHAVE_ASSINATURA.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototipo:
    name: Testes do protótipo (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  android:
    name: Regras, app e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Mesma chave de depuração em todos os builds: sem ela, cada APK novo teria outra
      # assinatura e o Android não deixaria instalar por cima (perderia os dados).
      - name: Chave de depuração estável
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chave-depuracao-meus-fretes-v1

      - name: Testes das regras (:core)
        run: ./gradlew :core:test --stacktrace

      - name: Testes e APK debug (:app)
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # O esquema do banco (app/schemas) precisa estar no Git: é a base das migrações.
      - name: Conferir esquema do banco versionado
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Esquema do Room mudou ou não está no Git. Conteúdo gerado:"
            for f in $(git ls-files --others --modified app/schemas); do echo "===== $f"; cat "$f"; echo; done
            exit 1
          fi

      - name: Guardar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: meus-fretes-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # APK com link direto (sem .zip) na página Releases, etiqueta fixa "meus-fretes".
      # Só no main. Cada arquivo de download continua associado à sua assinatura:
      # https://github.com/Fomes1574/FretesHumberto/releases/download/meus-fretes/MeusFretes.apk
      - name: Publicar APK nos Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk MeusFretes.apk
          # Um cache ausente pode gerar outra chave. Confira o certificado do APK
          # publicado antes de substituir o link que os usuários usam para atualizar.
          anterior=$(mktemp -d)
          gh release download meus-fretes --pattern MeusFretes.apk --dir "$anterior"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          assinatura() {
            "$apksigner" verify --print-certs "$1" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' | sort
          }
          antiga=$(assinatura "$anterior/MeusFretes.apk")
          nova=$(assinatura MeusFretes.apk)
          [[ -n "$antiga" && -n "$nova" ]]
          arquivo=MeusFretes.apk
          if [[ "$antiga" != "$nova" ]]; then
            echo "::warning::A chave do APK mudou. O link de atualização anterior foi preservado."
            arquivo=MeusFretes-nova-instalacao.apk
            publicados=$(gh release view meus-fretes --json assets --jq '.assets[].name')
            if grep -Fxq "$arquivo" <<< "$publicados"; then
              gh release download meus-fretes --pattern "$arquivo" --dir "$anterior"
              alternativa=$(assinatura "$anterior/$arquivo")
              [[ -n "$alternativa" ]]
              if [[ "$alternativa" != "$nova" ]]; then
                arquivo="MeusFretes-nova-instalacao-${nova:0:12}.apk"
                if grep -Fxq "$arquivo" <<< "$publicados"; then
                  gh release download meus-fretes --pattern "$arquivo" --dir "$anterior"
                  [[ "$(assinatura "$anterior/$arquivo")" == "$nova" ]]
                fi
              fi
            fi
            cp MeusFretes.apk "$arquivo"
          fi
          cat > notas.md <<NOTAS
          Meus Fretes, gerado automaticamente do commit \`${GITHUB_SHA::7}\` em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') (horário de Brasília).

          Baixe **$arquivo** para instalar a versão atual no Android 8 ou mais novo.

          - Antes de atualizar, faça uma cópia em Ajustes → Fazer cópia e guarde o arquivo fora da pasta do aplicativo.
          - O Android permite instalar por cima da versão baixada pelo mesmo arquivo. Cada nome de arquivo fica associado a uma chave de assinatura.
          - Se sua versão veio de outro arquivo e o Android recusar a atualização, confira a cópia antes de fazer uma instalação nova e restaurar os dados em Ajustes.
          - Esta versão usa chave de depuração. Veja docs/CHAVE_ASSINATURA.md.
          NOTAS
          gh release upload meus-fretes "$arquivo" --clobber
          gh release edit meus-fretes --latest --notes-file notas.md

      - name: Guardar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: '**/build/reports/tests/'
          retention-days: 7

      # ---- Release assinado: só em tag v* e só se a chave existir nos Secrets.
      - name: Preparar chave de assinatura
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.FRETES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret FRETES_KEYSTORE_BASE64 ausente. Veja docs/CHAVE_ASSINATURA.md"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fretes.jks"
          echo "FRETES_KEYSTORE_PATH=$RUNNER_TEMP/fretes.jks" >> "$GITHUB_ENV"

      - name: APK release assinado
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FRETES_KEYSTORE_PASSWORD: ${{ secrets.FRETES_KEYSTORE_PASSWORD }}
          FRETES_KEY_ALIAS: ${{ secrets.FRETES_KEY_ALIAS }}
          FRETES_KEY_PASSWORD: ${{ secrets.FRETES_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MeusFretes-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "MeusFretes-${GITHUB_REF_NAME}.apk" \
            --title "Meus Fretes ${GITHUB_REF_NAME}" \
            --notes "APK assinado para instalar por cima da versão anterior. Veja CHANGELOG.md."
